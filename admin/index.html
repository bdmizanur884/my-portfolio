<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Login — PhotoShare Portfolio</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="admin-login-wrap">
  <div class="admin-login-card">
    <div class="logo" style="margin-bottom:6px;">Photo<span>Share</span></div>
    <p style="color:#8f9ab0;margin-bottom:22px;font-size:14px;">Admin Dashboard Login</p>

    <div id="loginError" class="upload-error" style="display:none;margin-bottom:14px;"></div>

    <form id="loginForm" class="contact-form">
      <input type="email" name="email" placeholder="Admin Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Log In</button>
    </form>

    <p style="margin-top:18px;"><a href="../index.html" style="color:#8b93ab;font-size:13px;">← Back to website</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/toast.js"></script>
<script src="js/auth.js"></script>
</body>
                                                                                                                 </html>
